name: generate pacman game

on:
  schedule:
    # Roda automaticamente todo dia as 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: # Permite acionamento manual
  push: # Roda a cada push na branch principal
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write # Permissao para escrever no repositorio (para salvar o SVG)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }} # Pega o usuario dono do repo
          # Token pessoal com escopo read:user, para contar tambem as contribuicoes.
          # Aceita as tres grafias do secret; se nenhum existir, usa o token
          # padrao da Action e conta apenas as contribuicoes publicas.
          github_token: ${{ secrets.PACKMAN_TOKEN || secrets.PACKMAIN_TOKEN || secrets.PACMAN_TOKEN || github.token }}
          games: "pacman" # Gera dist/pacman-contribution-graph.svg e a variante -dark

      # Envia os SVGs gerados para a branch 'output'
      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
