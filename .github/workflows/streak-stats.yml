name: Atualizar estatísticas de contribuições

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar cartão de sequência
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1
        with:
          options: user=${{ github.repository_owner }}&locale=pt_BR&mode=daily&theme=dracula&hide_border=false&border_radius=5&disable_animations=true
          path: profile/streak.svg

      - name: Salvar cartão atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: atualizar estatísticas de contribuições" || exit 0
          git push
